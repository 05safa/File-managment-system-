# Server
# changed to avoid conflict with Docker/WSL using 8084
server.port=8084

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/documents_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=docuser
spring.datasource.password=docpass123

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MinIO Configuration - Default for local development
minio.url=http://localhost:9000
minio.public-url=http://localhost:9000
minio.access-key=admin
minio.secret-key=ensia123456
minio.bucket-name=documents

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# JWT (Exercise C3 - same secret as auth-service)
jwt.secret=${JWT_SECRET:ensia-dms-jwt-secret-key-for-lab-11-minimum-256-bits-long!!}

# File upload configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB