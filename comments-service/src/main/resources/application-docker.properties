# Docker environment for Comments Service (Cassandra - Exercise C2)
server.port=8086

spring.cassandra.keyspace-name=dms
spring.cassandra.contact-points=${CASSANDRA_HOST:cassandra}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=create-if-not-exists
spring.cassandra.init-script-location=classpath:schema.cql

jwt.secret=${JWT_SECRET:ensia-dms-jwt-secret-key-for-lab-11-minimum-256-bits-long!!}
