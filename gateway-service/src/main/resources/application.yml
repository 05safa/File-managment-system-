server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: documents
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/documents/**
              
            - id: comments
              uri: ${COMMENTS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/comments/**
              