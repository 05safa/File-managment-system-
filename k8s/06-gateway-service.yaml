apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: docker-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway
        image: docker-minio-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8085
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: DOCUMENTS_SERVICE_URL
          value: "http://documents-service:8084"
        - name: COMMENTS_SERVICE_URL
          value: "http://comments-service:8086"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8085
          initialDelaySeconds: 20
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: docker-minio
spec:
  selector:
    app: gateway-service
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
  type: LoadBalancer
