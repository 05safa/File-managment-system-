apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-service
  namespace: docker-minio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documents-service
  template:
    metadata:
      labels:
        app: documents-service
    spec:
      containers:
      - name: documents
        image: docker-minio-documents:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-documents:5432/documents_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "docuser"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-documents-secret
              key: POSTGRES_PASSWORD
        - name: MINIO_URL
          value: "http://minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "admin"
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        - name: COMMENTS_SERVICE_URL
          value: "http://comments-service:8086"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/documents/list
            port: 8084
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/documents/list
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: documents-service
  namespace: docker-minio
spec:
  selector:
    app: documents-service
  ports:
  - port: 8084
    targetPort: 8084
    protocol: TCP
  type: ClusterIP

